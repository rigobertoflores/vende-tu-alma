<div class="app-shell" [class.has-bottom-nav]="showBottomNav()">
  <header class="top-bar" *ngIf="showTopBar()">
    <div class="brand">
      <span class="brand-icon">♦</span>
      Vende tu Alma
    </div>
    <div class="credit-pill" *ngIf="hasUser()">
      <span class="credit-value">{{ credits() }}</span>
      <span class="credit-label">cr</span>
    </div>
  </header>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <nav class="bottom-nav" *ngIf="showBottomNav()">
    <a class="nav-link" routerLink="/catalogo" routerLinkActive="active">Catálogo</a>
    <a class="nav-link" routerLink="/mi-alma" routerLinkActive="active">Mi Alma</a>
    <a class="nav-link" routerLink="/buscar" routerLinkActive="active">Buscar</a>
    <a class="nav-link" routerLink="/marcador" routerLinkActive="active">Marcador</a>
  </nav>
</div>
